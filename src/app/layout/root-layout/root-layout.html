<div class="flex-1 h-[calc(100vh-4rem)] min-h-0 overflow-hidden drawer lg:drawer-open">
  <input #drawerToggle id="root-drawer" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col h-full min-h-0 overflow-hidden bg-base-100">
    <nav class="navbar w-full bg-neutral-900 border-r border-white/10 lg:hidden shrink-0">
      <label for="root-drawer" aria-label="Abrir menu" class="btn btn-square btn-ghost">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="text-white"
        >
          <path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" />
        </svg>
      </label>
      <span class="px-2 text-white font-semibold">Painel Root</span>
    </nav>

    <div class="flex-1 min-h-0 overflow-y-auto">
      <router-outlet></router-outlet>
    </div>
  </div>

  <div class="drawer-side z-40 top-16 h-[calc(100vh-4rem)] lg:top-0 lg:h-full">
    <label for="root-drawer" aria-label="Fechar menu" class="drawer-overlay"></label>

    <aside
      class="bg-neutral-900 border-r border-white/10 h-full min-h-full w-72 sm:w-64 flex flex-col overflow-hidden"
    >
      <div class="p-4 border-b border-white/10 shrink-0">
        <div class="flex items-center gap-3 p-3 rounded-xl bg-primary/10">
          <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center shrink-0">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-primary-content"
              aria-hidden="true"
            >
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
            </svg>
          </div>
          <div class="min-w-0">
            <p class="font-semibold text-sm text-primary truncate leading-tight">Painel Root</p>
            <p class="text-xs text-white/50 truncate">Administração da plataforma</p>
          </div>
        </div>

        <a
          routerLink="/"
          class="btn btn-ghost btn-sm w-full mt-2 gap-2 justify-start text-white/70 border-none shadow-none hover:bg-white/10 hover:text-white hover:border-none hover:shadow-none"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m12 19-7-7 7-7" /><path d="M19 12H5" />
          </svg>
          Voltar ao site
        </a>
      </div>

      <nav class="flex-1 p-3 overflow-y-auto" aria-label="Painel root">
        <p class="text-xs font-semibold text-white/40 uppercase tracking-wider px-3 mb-2">Sistema</p>
        <ul class="menu menu-md gap-1 p-0 w-full">
          @for (item of navItems(); track item.url) {
            <li>
              <a
                [routerLink]="item.url"
                [class]="
                  item.active
                    ? 'bg-primary text-white'
                    : 'text-white/70 hover:bg-white/10 hover:text-white'
                "
                [attr.aria-current]="item.active ? 'page' : null"
                (click)="closeDrawerOnMobile()"
                class="rounded-none"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  @switch (item.icon) {
                    @case ('overview') {
                      <rect width="7" height="9" x="3" y="3" rx="1" />
                      <rect width="7" height="5" x="14" y="3" rx="1" />
                      <rect width="7" height="9" x="14" y="12" rx="1" />
                      <rect width="7" height="5" x="3" y="16" rx="1" />
                    }
                    @case ('users') {
                      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                      <circle cx="9" cy="7" r="4" />
                      <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    }
                    @case ('clubs') {
                      <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
                      <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
                      <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" />
                      <path d="M10 6h4" /><path d="M10 10h4" /><path d="M10 14h4" /><path d="M10 18h4" />
                    }
                    @case ('plans') {
                      <rect width="20" height="14" x="2" y="5" rx="2" />
                      <line x1="2" x2="22" y1="10" y2="10" />
                    }
                    @case ('sports') {
                      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                      <path d="M4 22h16" />
                      <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                      <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                      <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
                    }
                    @case ('flags') {
                      <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
                      <line x1="4" x2="4" y1="22" y2="15" />
                    }
                  }
                </svg>
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </aside>
  </div>
</div>
