<div class="flex-1 h-[calc(100vh-4rem)] min-h-0 overflow-hidden drawer lg:drawer-open">
  <input id="admin-drawer" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col h-full min-h-0 overflow-hidden bg-base-100">

    <nav class="navbar w-full bg-base-300 lg:hidden shrink-0">
      <label for="admin-drawer" aria-label="Abrir menu" class="btn btn-square btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true" class="text-white">
          <path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>
        </svg>
      </label>
      <span class="px-2 font-semibold">{{ clubName() }}</span>
    </nav>

    <div class="p-4 flex-1 min-h-0 overflow-y-auto">
      <div class="mx-auto max-w-7xl w-full">
        <div class="px-4">
          <app-breadcrumb></app-breadcrumb>
        </div>
        <router-outlet></router-outlet>
      </div>
    </div>

  </div>

  <div class="drawer-side z-40 top-16 h-[calc(100vh-4rem)] lg:top-0 lg:h-full">
    <label for="admin-drawer" aria-label="Fechar menu" class="drawer-overlay"></label>

    <aside class="bg-neutral-900 border-r border-white/10 h-full min-h-full w-72 sm:w-64 flex flex-col overflow-hidden">

      <div class="p-4 border-b border-white/10 shrink-0">
        <div class="flex items-center gap-3 p-3 rounded-xl bg-primary/10">
          <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="text-primary-content" aria-hidden="true">
              <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
              <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
              <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 0-2 2h-2"/>
              <path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>
            </svg>
          </div>
          <div class="min-w-0">
            <p class="font-semibold text-sm text-primary truncate leading-tight">{{ clubName() }}</p>
            <p class="text-xs text-white/50 truncate">{{ clubCity() }}</p>
          </div>
        </div>

        <button
          type="button"
          class="btn btn-ghost btn-sm w-full mt-2 gap-2 justify-start text-white/70 border-none shadow-none hover:bg-white/10 hover:text-white hover:border-none hover:shadow-none"
          (click)="goToSwitchClub()">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/>
          </svg>
          Trocar clube
        </button>
      </div>

      <nav class="flex-1 p-3 overflow-hidden" aria-label="Painel administrativo">
        <p class="text-xs font-semibold text-white/40 uppercase tracking-wider px-3 mb-2">Painel</p>
        <ul class="menu menu-md gap-1 p-0 w-full">

          <li>
            <button
              type="button"
              [class]="isActive('overview') ? 'bg-primary text-white' : 'text-white/70 hover:bg-white/10 hover:text-white'"
              [attr.aria-current]="isActive('overview') ? 'page' : null"
              (click)="goToOverview(); closeDrawerOnMobile()"
              class="rounded-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/>
                <rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
              </svg>
              Visão Geral
            </button>
          </li>

          <li>
            <button
              type="button"
              [class]="isActive('courts') ? 'bg-primary text-white' : 'text-white/70 hover:bg-white/10 hover:text-white'"
              [attr.aria-current]="isActive('courts') ? 'page' : null"
              (click)="goToCourts(); closeDrawerOnMobile()"
              class="rounded-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              Quadras
            </button>
          </li>

          <li>
            <button
              type="button"
              [class]="isActive('reserves') ? 'bg-primary text-white' : 'text-white/70 hover:bg-white/10 hover:text-white'"
              [attr.aria-current]="isActive('reserves') ? 'page' : null"
              (click)="goToReserves(); closeDrawerOnMobile()"
              class="rounded-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M8 2v4"/><path d="M16 2v4"/>
                <rect width="18" height="18" x="3" y="4" rx="2"/>
                <path d="M3 10h18"/>
              </svg>
              Reservas
            </button>
          </li>

          <li>
            <button
              type="button"
              [class]="isActive('config') ? 'bg-primary text-white' : 'text-white/70 hover:bg-white/10 hover:text-white'"
              [attr.aria-current]="isActive('config') ? 'page' : null"
              (click)="goToConfig(); closeDrawerOnMobile()"
              class="rounded-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              Configurações
            </button>
          </li>

        </ul>
      </nav>

    </aside>
  </div>
</div>
