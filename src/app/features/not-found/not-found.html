<div class="flex flex-col bg-base-100 min-h-screen">
  <section
    class="flex-1 flex flex-col items-center justify-center gap-8 px-4 py-12 text-center bg-base-100"
    aria-labelledby="not-found-title"
  >
    <!-- Quadra com interrogação (decorativo: o título já descreve a situação) -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 600 360"
      class="w-full max-w-3xl h-auto text-primary"
      fill="none"
      width="300"
      height="130"
      stroke="currentColor"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Piso da quadra -->
      <rect
        x="40"
        y="40"
        width="520"
        height="280"
        rx="14"
        fill="currentColor"
        fill-opacity="0.08"
      />

      <!-- Linha central e círculo central -->
      <line x1="300" y1="40" x2="300" y2="115" />
      <line x1="300" y1="245" x2="300" y2="320" />
      <circle cx="300" cy="180" r="62" />

      <!-- Áreas -->
      <rect x="40" y="110" width="90" height="140" />
      <rect x="470" y="110" width="90" height="140" />

      <!-- Semicírculos das áreas -->
      <path d="M130 135 A45 45 0 0 1 130 225" />
      <path d="M470 135 A45 45 0 0 0 470 225" />

      <!-- Gols / tabelas -->
      <rect x="22" y="150" width="18" height="60" rx="3" />
      <rect x="560" y="150" width="18" height="60" rx="3" />

      <!-- Ponto da marca central -->
      <circle cx="300" cy="180" r="4" fill="currentColor" />

      <!-- Interrogação no centro -->
      <text
        x="300"
        y="218"
        text-anchor="middle"
        font-size="110"
        font-weight="800"
        fill="currentColor"
        stroke="none"
        font-family="sans-serif"
      >
        ?
      </text>
    </svg>

    <div class="flex flex-col gap-3 max-w-lg">
      <p class="text-sm font-semibold uppercase tracking-widest text-primary">Erro 404</p>
      <h1
        id="not-found-title"
        class="font-destaque text-4xl md:text-5xl font-bold text-base-content"
      >
        Tela não encontrada
      </h1>
      <p class="text-base-content/70">
        O endereço que você digitou não existe ou foi movido. Verifique a URL ou volte para o
        início.
      </p>
    </div>

    <div class="flex flex-wrap justify-center gap-3">
      <a routerLink="/" class="btn btn-primary text-white rounded-lg">Voltar ao início</a>
      <a routerLink="/clubs" class="btn btn-outline rounded-lg">Ver clubes</a>
    </div>
  </section>
</div>
<app-footer class="mt-auto"></app-footer>
