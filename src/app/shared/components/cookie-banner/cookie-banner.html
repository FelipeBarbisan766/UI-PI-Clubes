@if (!consent.accepted()) {
  <section
    role="region"
    aria-label="Aviso de cookies"
    class="fixed bottom-0 inset-x-0 z-50 p-4 sm:p-6"
  >
    <div
      class="mx-auto max-w-5xl flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-8
             rounded-3xl border border-white/10 bg-neutral/95 backdrop-blur-md
             px-6 py-6 sm:px-8 shadow-2xl text-white"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cookie preview-icon h10 w-10"><path d="M11 17h.01"/><path d="M11.496 2c.324-.016.558.292.529.615a4 4 0 004.235 4.368.713.713 0 01.758.757 4 4 0 004.366 4.237c.323-.03.63.204.614.527a10 10 0 01-2.915 6.566A1 1 0 114.93 4.918 10 10 0 0111.496 2"/><path d="M12 12h.01"/><path d="M16 16h.01"/><path d="M16 3h.01"/><path d="M21 4h.01"/><path d="M21 8h.01"/><path d="M7 14h.01"/><path d="M9 8h.01"/></svg>

      <div class="flex-1 space-y-1">
        <h2 class="font-destaque text-lg sm:text-xl font-bold">Nós usamos cookies</h2>
        <p class="text-base leading-relaxed text-gray-200">
          Usamos cookies para manter sua sessão ativa e melhorar sua experiência no Clubera.<br>
          Ao continuar navegando, você concorda com o uso de cookies.
        </p>
      </div>

      <button
        type="button"
        class="btn btn-primary btn-md sm:btn-lg rounded-lg font-bold text-white shrink-0 w-full sm:w-auto px-10"
        (click)="consent.accept()"
      >
        Entendi
      </button>
    </div>
  </section>
}
