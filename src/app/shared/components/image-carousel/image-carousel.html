@if (currentUrl(); as url) {
      <img [ngSrc]="url" [alt]="alt()" fill [priority]="priority()" class="object-cover" />

      @if (hasMultiple()) {
        <button
          type="button"
          class="absolute left-2 top-1/2 -translate-y-1/2 btn btn-circle btn-xs bg-base-100/70 border-none text-base-content hover:bg-base-100 backdrop-blur-sm"
          (click)="prev($event)"
          aria-label="Foto anterior"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="size-3.5"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
        </button>

        <button
          type="button"
          class="absolute right-2 top-1/2 -translate-y-1/2 btn btn-circle btn-xs bg-base-100/70 border-none text-base-content hover:bg-base-100 backdrop-blur-sm"
          (click)="next($event)"
          aria-label="Próxima foto"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="size-3.5"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </button>

        <div
          class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1.5"
          role="tablist"
          aria-label="Fotos"
        >
          @for (img of images(); track $index) {
            <button
              type="button"
              role="tab"
              class="h-1.5 rounded-full transition-all"
              [class]="$index === activeIndex() ? 'bg-white w-4' : 'bg-white/60 w-1.5'"
              [attr.aria-selected]="$index === activeIndex()"
              [attr.aria-label]="'Ver foto ' + ($index + 1)"
              (click)="goTo($index, $event)"
            ></button>
          }
        </div>
      }
    } @else {
      <div class="flex h-full w-full items-center justify-center bg-base-200">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-8 text-base-content/30"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Z"
          />
        </svg>
      </div>
    }
