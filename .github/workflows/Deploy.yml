name: Deploy Front

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build Angular
        run: npx ng build --configuration production

      - name: Up nginx container
        run: docker compose -f docker-compose.front.yml up -d
